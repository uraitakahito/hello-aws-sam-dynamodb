AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: TODO REST API - AWS SAM + DynamoDB 学習用サンプル

Parameters:
  TodosTableName:
    Type: String
    Default: Todos
    Description: DynamoDBテーブル名。テーブル定義と Lambda 環境変数で共有する。

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    MemorySize: 128
    Architectures:
      - arm64
    Environment:
      Variables:
        TODOS_TABLE_NAME: !Ref TodosTableName
        NODE_OPTIONS: --enable-source-maps

Resources:
  TodosTable:
    Type: AWS::DynamoDB::Table
    # 学習用リポジトリのため、スタック削除時はテーブルも削除する (既定と同じだが意図を明示)。
    # 本番でデータを保持したい場合は Retain にする。
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Ref TodosTableName
      # BillingMode の選択肢:
      #   PAY_PER_REQUEST (オンデマンド) - リクエスト数による従量課金。WCU/RCU の事前見積もり不要、
      #                                    トラフィックが読めない学習・開発用途に最適。本リポジトリで採用。
      #   PROVISIONED                    - WCU/RCU を事前確保する固定費モデル。
      #                                    トラフィックが安定・予測できる本番向け (ProvisionedThroughput の設定が必要)。
      # 注: どちらのモードでも 1 パーティションあたり 1000 WCU / 3000 RCU の物理上限は共通 (Hot Partition の原因)。
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
    # 学習用のため DynamoDB は既定の AWS 所有キー (無料) で暗号化済みとし、
    # cfn-guard の SSE 必須ルールだけをこのテーブルで抑制する。
    # 本番化する場合はこの抑制を外し、Properties に SSESpecification を明示する。
    Metadata:
      guard:
        SuppressedRules:
          - DYNAMODB_TABLE_MUST_BE_ENCRYPTED   # SSESpecification 必須を免除
          - DYNAMODB_TABLE_ENCRYPTED_KMS       # KMS 鍵 (SSEType: KMS) 必須を免除

  TodosApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  CreateTodoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/createTodo.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TodosTableName
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TodosApi
            Path: /todos
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2024
        Sourcemap: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - handlers/createTodo.ts

  ListTodosFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/listTodos.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TodosTableName
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TodosApi
            Path: /todos
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2024
        Sourcemap: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - handlers/listTodos.ts

  GetTodoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/getTodo.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TodosTableName
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TodosApi
            Path: /todos/{id}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2024
        Sourcemap: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - handlers/getTodo.ts

  UpdateTodoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/updateTodo.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TodosTableName
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TodosApi
            Path: /todos/{id}
            Method: PUT
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2024
        Sourcemap: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - handlers/updateTodo.ts

  DeleteTodoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/deleteTodo.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TodosTableName
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref TodosApi
            Path: /todos/{id}
            Method: DELETE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2024
        Sourcemap: true
        External:
          - "@aws-sdk/*"
        EntryPoints:
          - handlers/deleteTodo.ts

Outputs:
  ApiUrl:
    Description: TODO REST API のベースURL
    Value: !Sub "https://${TodosApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  TodosTableName:
    Description: DynamoDBテーブル名
    Value: !Ref TodosTableName
